<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Animation Result</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f8f9fa;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .showcase-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .heart-checkbox {
      display: none;
    }

    .heart-label {
      cursor: pointer;
      display: inline-block;
      padding: 10px;
      -webkit-tap-highlight-color: transparent;
    }

    .heart-icon {
      width: 80px;
      height: 80px;
      fill: #e0e0e0;
      stroke: #b0b0b0;
      stroke-width: 1.5px;
      transition: fill 0.2s ease, stroke 0.2s ease, transform 0.1s ease;
    }

    .heart-label:active .heart-icon {
      transform: scale(0.9);
    }

    .love-text {
      font-size: 28px;
      font-weight: 600;
      color: #ff2a54;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    /* ANIMATION ACTIONS WHEN TAPPED */

    .heart-checkbox:checked + .showcase-container .heart-label .heart-icon {
      fill: #ff2a54;
      stroke: #ff2a54;
      animation: heartPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .heart-checkbox:checked + .showcase-container .love-text {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes heartPop {
      0% { transform: scale(1); }
      30% { transform: scale(0.7); }
      60% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <input type="checkbox" id="heart-trigger" class="heart-checkbox">
  
  <div class="showcase-container">
    
    <label for="heart-trigger" class="heart-label">
      <svg class="heart-icon" viewBox="0 0 24 24" xmlns="http://w3.org">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </label>

    <div class="love-text">I love you</div>

  </div>

</body>
</html>
