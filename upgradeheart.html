<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Card Showcase</title>
  <style>
    body {
     background-image: url("Kitchie.JPG");
     background-size: cover;
     background-position: center;
     background-repeat: no-repeat;
     background-attachment: fixed;
     margin: 0;
     display: flex;
     justify-content: center;
     align-items: center;
     min-height: 100vh;
    }
    
    /* Main card container */
    .photo-card {
      background-color: #ffb6c1;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      width: 340px;
      position: relative;
    }

    /* Checkbox hack setup */
    .heart-checkbox {
      display: none;
    }

    /* PHOTO AREA (Uses CSS background instead of an <img> tag) */
    .image-wrapper {
      width: 100%;
      height: 260px;
      position: relative;

      /* Replace 'my-photo.jpg' with your actual uploaded filename */
      background-image: url("https://static.vecteezy.com/system/resources/previews/053/856/736/non_2x/beautiful-blue-sky-with-a-few-red-flowers-in-the-foreground-the-flowers-are-scattered-throughout-the-scene-with-some-in-the-foreground-and-others-in-the-background-free-photo.jpg"); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: transform 0.5s ease;
    }

    /* Zoom image container layout on click/hover */
    .photo-card:hover .image-wrapper {
      transform: scale(1.03);
    }

    /* FIREWORKS LAYOUT */
    .fireworks-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Base setup for individual firework particles */
    .firework {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      opacity: 0;
    }

    /* Position & color specs for firework 1 */
    .fw-1 {
      left: 30%;
      top: 40%;
      background: #ff2a54;
      box-shadow: 0 0 10px #ff2a54, -20px -30px 0 #ff2a54, 20px -30px 0 #ff5e7e, -30px 10px 0 #ff2a54, 30px 10px 0 #ff5e7e, 0px -40px 0 #ffffff;
    }

    /* Position & color specs for firework 2 */
    .fw-2 {
      left: 70%;
      top: 30%;
      background: #00f0ff;
      box-shadow: 0 0 10px #00f0ff, -25px -20px 0 #00f0ff, 25px -20px 0 #76f5ff, -15px 30px 0 #00f0ff, 15px 30px 0 #76f5ff, 0px -35px 0 #ffffff;
    }

    /* Position & color specs for firework 3 */
    .fw-3 {
      left: 50%;
      top: 60%;
      background: #ffec00;
      box-shadow: 0 0 10px #ffec00, -30px -15px 0 #ffec00, 30px -15px 0 #fff370, -20px 25px 0 #ffec00, 20px 25px 0 #fff370, 0px -30px 0 #ffffff;
    }

    /* Bottom section layout */
    .card-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 10px;
      background-color: white;
      position: relative;
      z-index: 3;
    }

    .heart-label {
      cursor: pointer;
      display: inline-block;
      -webkit-tap-highlight-color: transparent;
    }

    .heart-icon {
      width: 70px;
      height: 70px;
      fill: #e0e0e0;
      stroke: #b0b0b0;
      stroke-width: 1.5px;
      transition: fill 0.2s ease, stroke 0.2s ease, transform 0.1s ease;
    }

    .love-text {
      font-size: 26px;
      font-weight: 600;
      color: #ff2a54;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* CLICKED / TAPPED STATES */

    /* 1. Turn heart red and bounce */
    .heart-checkbox:checked + .photo-card .heart-label .heart-icon {
      fill: #ff2a54;
      stroke: #ff2a54;
      animation: heartPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* 2. Show text */
    .heart-checkbox:checked + .photo-card .love-text {
      opacity: 1;
      transform: translateY(0);
    }

    /* 3. Trigger Firework Explosions */
    .heart-checkbox:checked + .photo-card .firework {
      animation: explode 0.8s ease-out forwards;
    }

    /* ANIMATION KEYFRAMES */
    @keyframes heartPop {
      0% { transform: scale(1); }
      30% { transform: scale(0.7); }
      60% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    @keyframes explode {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
    
      100% {
        transform: scale(2.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Toggle switch wrapper -->
  <input type="checkbox" id="card-trigger" class="heart-checkbox">
  
  <div class="photo-card">
    
    <!-- This div holds your background photo and layout -->
    <div class="image-wrapper">

      <iframe class="card-video" 
       src="https://youtube.com"
      frameborder="0" allow="autoplay; 
      encrypted-media" 
      allowfullscreen>
       </iframe>

      
      <!-- Firework overlays -->
      <div class="fireworks-container">
        <div class="firework fw-1"></div>
        <div class="firework fw-2"></div>
        <div class="firework fw-3"></div>
      </div>
    </div>
    
    <div class="card-footer">
      <label for="card-trigger" class="heart-label">
        <svg class="heart-icon" viewBox="0 0 24 24" xmlns="http://w3.org">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </label>
      
      <div class="love-text">happy birthday Kitchie🥹🥹🥹🥹</div>
    </div>

  </div>

</body>
</html>
