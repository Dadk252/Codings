<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animation Showcase</title>
  <style>
    /* Reset and Layout Styles */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f6fa;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    h1 {
      color: #2f3640;
      margin-bottom: 10px;
    }

    /* Container for the demo cards */
    .showcase-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      max-width: 1200px;
      width: 100%;
    }

    /* Card Layouts */
    .animation-card {
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      padding: 20px;
      width: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .animation-card h3 {
      color: #718093;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.1rem;
    }

    /* Target areas where animations perform */
    .demo-zone {
      height: 160px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ==========================================
       EXAMPLE 1: BOUNCING BALL ANIMATION
       ========================================== */
    .ball {
      width: 50px;
      height: 50px;
      background-color: #ff4757;
      border-radius: 50%;
      /* Setup the vertical bounce loop */
      animation: bounce 0.6s ease-in-out infinite alternate;
    }

    @keyframes bounce {
      0% {
        transform: translateY(40px);
      }
      100% {
        transform: translateY(-40px);
      }
    }

    /* ==========================================
       EXAMPLE 2: LOADING SPINNER ANIMATION
       ========================================== */
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3498db;
      border-radius: 50%;
      /* Setup smooth constant rotation */
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* ==========================================
       EXAMPLE 3: PULSE & COLOR SHIFT ANIMATION
       ========================================== */
    .pulse-box {
      width: 100px;
      height: 100px;
      background-color: #2ed573;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      border-radius: 12px;
      /* Setup complex scaling, color changes, and glowing glow */
      animation: pulseColor 3s ease-in-out infinite;
    }

    @keyframes pulseColor {
      0% {
        transform: scale(1);
        background-color: #2ed573;
        box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.7);
      }
      50% {
        transform: scale(1.15);
        background-color: #1e90ff;
        box-shadow: 0 0 25px 15px rgba(30, 144, 255, 0);
      }
      100% {
        transform: scale(1);
        background-color: #2ed573;
        box-shadow: 0 0 0 0 rgba(46, 213, 115, 0);
      }
    }
  </style>
</head>
<body>

  <h1>CSS Animation Showcase</h1>
  
  <div class="showcase-container">

    <!-- Card 1: Bouncing Ball -->
    <div class="animation-card">
      <h3>1. Bouncing Ball</h3>
      <div class="demo-zone">
        <div class="ball"></div>
      </div>
    </div>

    <!-- Card 2: Spinner -->
    <div class="animation-card">
      <h3>2. Loading Spinner</h3>
      <div class="demo-zone">
        <div class="loading-spinner"></div>
      </div>
    </div>

    <!-- Card 3: Pulse Box -->
    <div class="animation-card">
      <h3>3. Pulse & Color</h3>
      <div class="demo-zone">
        <div class="pulse-box">Pulse</div>
      </div>
    </div>

  </div>

</body>
</html>
