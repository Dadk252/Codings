<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f8f9fa;
      margin: 0;
    }

    /* Hide the checkbox completely */
    .heart-checkbox {
      display: none;
    }

    /* Label wrapper acts as the clickable area */
    .heart-label {
      cursor: pointer;
      display: inline-block;
      padding: 10px;
    }

    /* Default unclicked state (grey) */
    .heart-icon {
      width: 60px;
      height: 60px;
      fill: #e0e0e0;
      stroke: #b0b0b0;
      stroke-width: 1.5px;
      transition: fill 0.2s ease, stroke 0.2s ease, transform 0.1s ease;
    }

    /* Small hover effect for desktop users */
    .heart-label:hover .heart-icon {
      transform: scale(1.05);
    }

    /* When the checkbox is checked, change color and run the pop animation */
    .heart-checkbox:checked + .heart-label .heart-icon {
      fill: #ff2a54;
      stroke: #ff2a54;
      animation: heartPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* Keyframe animation for the bounce effect */
    @keyframes heartPop {
      0% {
        transform: scale(1);
      }
      30% {
        transform: scale(0.7); /* Shrinks down slightly */
      }
      60% {
        transform: scale(1.3); /* Pops up large */
      }
      100% {
        transform: scale(1); /* Settles back to normal size */
      }
    }
  </style>
</head>
<body>

  <!-- The Checkbox Hack Container -->
  <input type="checkbox" id="heart-trigger" class="heart-checkbox">
  
  <label for="heart-trigger" class="heart-label">
    <svg class="heart-icon" viewBox="0 0 24 24" xmlns="http://w3.org">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
  </label>

</body>
</html>
